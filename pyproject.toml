[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "draftkit"
dynamic = ["version"]
description = "Reusable contexts for LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Isaac Flath", email = "isaac.flath@gmail.com"}]
keywords = ["llm", "context", "markdown", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "beautifulsoup4",
    "html2text",
    "httpx",
    "pypdf",
    "requests",
]

[project.optional-dependencies]
browser = ["playwrightnb"]
test = ["pytest"]

[project.urls]
Issues = "https://github.com/isaac-flath/draftkit/issues"
Repository = "https://github.com/isaac-flath/draftkit"

[tool.setuptools.dynamic]
version = {attr = "draftkit.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
